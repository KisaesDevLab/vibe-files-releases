name: Feature request
description: Suggest something Vibe Files should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach or paste client documents, real client names, SSNs or EINs, passwords, B2 keys, or screenshots showing them. Issues are public.**
        Use made-up names and sample files. For anything that needs client data, email support@kisaes.com instead.
  - type: input
    id: version
    attributes:
      label: Version you use
      description: From the app's footer.
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The task in your firm's day, not the feature.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
  - type: textarea
    id: help
    attributes:
      label: What would help
  - type: checkboxes
    id: no-client-data
    attributes:
      label: Client data
      options:
        - label: This request contains no client documents, client data, keys or screenshots showing them.
          required: true
